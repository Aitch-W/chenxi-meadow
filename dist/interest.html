<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efe6d0">
<title>兴趣地带 · AITCH</title>
<style>
  :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#efe6d0;color:#3b3a2f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 30% 20%,#f6efdc,#e6d9bd 58%,#d6c6a2);display:flex;align-items:center;justify-content:center}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(120,100,60,.12) 1px,transparent 1px);background-size:14px 14px}
  .route{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .wrap{position:relative;z-index:2;text-align:center;padding:40px}
  h1{font:600 52px "Songti SC","SimSun",serif;letter-spacing:14px;color:#3b3a2f;margin:0 0 20px}
  p{font-size:13px;letter-spacing:3px;line-height:2;color:#6b6450;margin:0}
  .back{position:fixed;left:28px;top:24px;z-index:3;color:#4b6536;text-decoration:none;font-size:12px;letter-spacing:2px}
  .back:hover{color:#2f5026}
</style>
</head>
<body>
  <a class="back" href="./">← 返回</a>
  <svg class="route" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M 80 500 C 300 420 380 220 620 260 S 880 140 920 90" fill="none" stroke="#b04a2f" stroke-width="2" stroke-dasharray="8 7" opacity="0.5"/>
  </svg>
  <div class="wrap">
    <h1>兴趣地带</h1>
    <p>这里将会放我感兴趣的东西。<br>（内容建设中，先把地图放上）</p>
  </div>
</body>
</html>
