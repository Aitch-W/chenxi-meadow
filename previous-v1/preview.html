<body>
<header><a class="brand" href="./" aria-label="回到首页">宸曦<span>CHENXI WANG</span></a><span class="header-note">一个正在生长的个人空间</span><button id="motion" aria-pressed="false">暂停飞行</button></header>
<main>
<section class="landscape" aria-label="飞过草野的动态三维风景"><div id="scene"></div><div class="scene-fade"></div><div class="scene-note"><span class="line"></span><p>风过草野<small>沿着风的方向，慢慢探索世界</small></p></div><div id="loading" role="status">风景正在展开…</div></section>
<section class="intro"><p class="eyebrow"><i></i> HELLO, I'M CHENXI</p><h1>你好，我是<br><span>王宸曦</span><b>。</b></h1><p class="school">河南大学<span>/</span>软件工程</p><div class="rule"></div><p class="description">在代码与灵感之间<br>探索自己的方向</p><p class="subtext">这里记录我的学习、创作，<br>以及一路遇见的风景。</p><div class="interests" aria-label="我的兴趣"><span>编程</span><span>AI 探索</span><span>创作</span></div><button class="flight" id="explore">一起乘风<span aria-hidden="true">↗</span></button><p class="hint" id="hint" aria-live="polite">移动鼠标，和小飞机一起兜兜风</p></section>
</main><footer><span>© 2026 王宸曦</span><span class="footer-center">保持好奇，自由生长</span><span><i></i> 此刻，正在探索</span></footer>
<script type="module">try {const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');

const host=document.getElementById('scene');
const scene=new THREE.Scene();scene.background=new THREE.Color('#f7f7ef');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const camera=new THREE.OrthographicCamera(-16,16,20,-20,.1,150);camera.position.set(0,50,19);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffed,0x657543,2.2));const sun=new THREE.DirectionalLight(0xfff4d6,3.1);sun.position.set(-15,30,-12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-30,right:30,top:45,bottom:-45,near:1,far:100});sun.shadow.bias=-.001;sun.shadow.normalBias=.04;sun.shadow.radius=4;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true});
const grass=mat('#a5cd49'),sand=mat('#e7d499'),roadMat=mat('#e7c88b'),water=mat('#39b7da'),white=mat('#faf9e9'),trunk=mat('#766346');
let seed=465;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const rnd=(a,b)=>a+rand()*(b-a);
function mesh(geo,m,x,y,z,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const length=72;const river=z=>2.5+2.7*Math.sin(z/length*Math.PI*2)+.6*Math.sin(z/length*Math.PI*4);const road=z=>-6.3+1.1*Math.sin(z/length*Math.PI*2+1);
function strip(fn,width,height,material,parent){const v=[];for(let i=0;i<=240;i++){let z=-length/2+i*length/240,x=fn(z);v.push(x-width/2,height,z,x+width/2,height,z)}const idx=[];for(let i=0;i<240;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();const o=new THREE.Mesh(g,material);o.receiveShadow=true;parent.add(o)}
const leaves=['#48753d','#658f3c','#7b9d42','#3e7545','#8cb34c'].map(mat);const rock=mat('#c8c9b2');
function tree(x,z,s,p){const group=new THREE.Group();group.position.set(x,0,z);group.scale.setScalar(s);p.add(group);mesh(new THREE.CylinderGeometry(.12,.18,1.5,6),trunk,0,.75,0,group);for(let i=0;i<7;i++){const a=i*2.4;const m=mesh(new THREE.IcosahedronGeometry(rnd(.55,.85),1),leaves[Math.floor(rand()*leaves.length)],Math.cos(a)*.48,1.4+rand()*.65,Math.sin(a)*.48,group);m.scale.y=rnd(.8,1.3)} }
function tile(offset){const p=new THREE.Group();p.position.z=offset;scene.add(p);mesh(new THREE.BoxGeometry(46,.5,length),grass,0,-.3,0,p);strip(river,5.1,.02,sand,p);strip(river,4.25,.04,water,p);strip(road,1.22,.035,sand,p);strip(road,.86,.045,roadMat,p);
for(let i=0;i<170;i++){const x=rnd(-22,22),z=rnd(-36,36);if(Math.abs(x-river(z))<3.1||Math.abs(x-road(z))<1.2)continue;tree(x,z,rnd(.35,1.05),p)}
for(let i=0;i<95;i++){const z=rnd(-36,36),x=river(z)+(rand()>.5?1:-1)*rnd(2.18,2.65);const r=mesh(new THREE.DodecahedronGeometry(rnd(.12,.36)),rock,x,.12,z,p);r.scale.y=.65}
const patchMats=['#a9cf53','#9bc443','#b5d75a'].map(mat);for(let i=0;i<220;i++){const x=rnd(-22,22),z=rnd(-36,36);if(Math.abs(x-river(z))<2.7||Math.abs(x-road(z))<.9)continue;const a=mesh(new THREE.CircleGeometry(rnd(.2,1.2),7),patchMats[i%3],x,-.035,z,p);a.rotation.x=-Math.PI/2;a.receiveShadow=true;a.castShadow=false}
for(let i=0;i<20;i++){const x=rnd(-12,13),z=rnd(-36,36);if(Math.abs(x-river(z))<3||Math.abs(x-road(z))<1)continue;mesh(new THREE.IcosahedronGeometry(.23,1),white,x,.26,z,p).scale.set(.8,1,1.35);mesh(new THREE.IcosahedronGeometry(.12,0),trunk,x,.25,z-.25,p)}
return p}
const tiles=[tile(-length),tile(0),tile(length)];
// White glider, independently animated above the moving landscape.
const plane=new THREE.Group();scene.add(plane);plane.position.set(-2,4.8,1);
const body=mesh(new THREE.SphereGeometry(.22,12,8),white,0,0,0,plane);body.scale.set(1,.8,3.6);
mesh(new THREE.BoxGeometry(2.5,.065,.33),white,0,.02,-.08,plane);mesh(new THREE.BoxGeometry(.86,.045,.22),white,0,.08,.55,plane);mesh(new THREE.BoxGeometry(.045,.33,.3),white,0,.19,.5,plane);const cockpit=mesh(new THREE.SphereGeometry(.14,12,8),mat('#526c6c'),0,.16,-.22,plane);cockpit.scale.set(.8,.6,1.5);
const red=mat('#ce7c59');mesh(new THREE.BoxGeometry(.12,.07,.34),red,-1.08,.025,-.08,plane);mesh(new THREE.BoxGeometry(.12,.07,.34),red,1.08,.025,-.08,plane);
const prop=new THREE.Group();prop.position.set(0,0,-.79);plane.add(prop);mesh(new THREE.BoxGeometry(.65,.035,.03),mat('#7d8977'),0,0,0,prop);
const clouds=[];const cloudmat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,flatShading:false});for(let i=0;i<8;i++){const c=new THREE.Group();c.position.set(rnd(-18,16),rnd(7,10),rnd(-40,40));for(let j=0;j<5;j++){let m=mesh(new THREE.SphereGeometry(rnd(.7,1.5),12,8),cloudmat,rnd(-1.4,1.4),rnd(-.2,.2),rnd(-.7,.7),c);m.scale.y=.5;m.castShadow=false}scene.add(c);clouds.push(c)}
const ripples=new THREE.Group();scene.add(ripples);const rippleMat=new THREE.MeshBasicMaterial({color:'#b1e6df',transparent:true,opacity:.5});for(let i=0;i<100;i++){const z=rnd(-36,36);const m=mesh(new THREE.PlaneGeometry(rnd(.04,.09),rnd(.22,.8)),rippleMat,river(z)+rnd(-1.6,1.6),.07,z,ripples);m.rotation.x=-Math.PI/2;m.userData={z,dx:m.position.x-river(z)};m.castShadow=false}
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,elapsed=0,last=0,boost=0,target=0;const button=document.getElementById('motion');function sync(){button.textContent=paused?'继续飞行':'暂停飞行';button.setAttribute('aria-pressed',String(paused))}sync();button.addEventListener('click',()=>{paused=!paused;sync()});
window.addEventListener('pointermove',e=>{target=(e.clientX/innerWidth-.5)*1.7});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')target=Math.max(-1,target-.25);if(e.key==='ArrowRight')target=Math.min(1,target+.25)});
document.getElementById('explore').addEventListener('click',()=>{paused=false;boost=5;sync();document.getElementById('hint').textContent='乘着风，再向前一点';});
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);const vertical=36;camera.left=-vertical*w/h/2;camera.right=vertical*w/h/2;camera.top=vertical/2;camera.bottom=-vertical/2;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();
function animate(ms){requestAnimationFrame(animate);let dt=Math.min((ms-last)/1000,.05);last=ms;if(!paused&&!document.hidden){elapsed+=dt;boost=Math.max(0,boost-dt);const speed=1.5+boost*.4;for(const t of tiles){t.position.z+=dt*speed;if(t.position.z>length*1.5)t.position.z-=length*3}plane.position.x+=(-2+Math.sin(elapsed*.7)*.5+target-plane.position.x)*.025;plane.position.y=4.8+Math.sin(elapsed*1.5)*.12;plane.rotation.z=Math.sin(elapsed*.9)*.07-target*.08;plane.rotation.y=Math.sin(elapsed*.7)*.045;prop.rotation.z+=dt*45;for(const c of clouds){c.position.z+=dt*.85;if(c.position.z>42)c.position.z=-42}for(const r of ripples.children){r.position.z+=dt*2.2;if(r.position.z>36)r.position.z=-36;const shift=tiles[1].position.z;const local=((r.position.z-shift+108)%72)-36;r.position.x=river(local)+r.userData.dx}}renderer.render(scene,camera)}requestAnimationFrame(animate);document.body.classList.add('loaded');
} catch(error) {document.getElementById("loading").textContent="风景暂未加载，请联网后刷新";document.getElementById("motion").disabled=true;document.getElementById("explore").disabled=true;}</script>
